[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-media-engine"
version = "0.1.0"
description = "A synchronous media engine bootstrap with an offline vertical slice"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ame = "ame.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
